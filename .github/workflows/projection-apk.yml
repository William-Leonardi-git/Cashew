name: Cashew Proiezione APK

on:
  push:
    branches: [feature/future-projection]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: budget
    steps:
      - name: Check out the source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Fetch Dart dependencies
        run: flutter pub get

      - name: Test the projection
        run: flutter test test/future_projection_test.dart test/projection_dashboard_test.dart --reporter expanded

      - name: Build and verify the signed Android release
        env:
          ORG_GRADLE_PROJECT_cashewProjectionApk: 'true'
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/cashew-projection.p12"
          trap 'rm -f -- android/key.properties "$keystore"' EXIT
          password="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$password"
          keytool -genkeypair -alias cashew-projection -keyalg RSA -keysize 2048 \
            -validity 10000 -keystore "$keystore" -storetype PKCS12 \
            -storepass "$password" -keypass "$password" \
            -dname 'CN=Cashew Projection' -noprompt
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=cashew-projection\nkeyPassword=%s\n' \
            "$keystore" "$password" "$password" > android/key.properties
          flutter build apk --release --build-number 418

          apk=../Cashew-Proiezione.apk
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk"
          metadata="$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk")"
          [[ "$metadata" == *"package: name='com.budget.tracker_app.proiezione'"* ]]
          [[ "$metadata" != *application-debuggable* ]]
          sha256sum "$apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          path: Cashew-Proiezione.apk
          archive: false
          if-no-files-found: error
          retention-days: 90
